services:
  chess-vision-service:
    build:
      context: ./chess-vision-service
      dockerfile: Dockerfile
    container_name: chess-vision-service
    ports:
      - "8001:8001"
    volumes:
      - ./chess-vision-service:/app
      - ./mock-data:/mock-data
      - /app/venv
    networks:
      - chess-net
    environment:
      - USE_MOCK_DATA=true
      - CAMERA_SOURCES=/mock-data
      - RABBITMQ_HOST=rabbitmq-broker
      - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq-broker:
        condition: service_healthy
    restart: always

  chess-logic-api:
    build:
      context: ./chess-logic-api
      dockerfile: Dockerfile
    container_name: chess-logic-api
    ports:
      - "8000:8000"
    volumes:
      - ./chess-logic-api:/app
    networks:
      - chess-net
    environment:
      - RABBITMQ_HOST=rabbitmq-broker
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      rabbitmq-broker:
        condition: service_healthy
    restart: always

  chess-web-ui:
    build:
      context: ./chess-web-ui
      dockerfile: Dockerfile
    container_name: chess-web-ui
    ports:
      - "3000:5173"
    volumes:
      - ./chess-web-ui:/app
      - /app/node_modules
    networks:
      - chess-net
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: always

  rabbitmq-broker:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - chess-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 15s
      retries: 5
    restart: always

networks:
  chess-net:
    driver: bridge
