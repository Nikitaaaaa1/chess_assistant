name: Web UI CI

on:
  push:
    paths:
      - 'chess-web-ui/**'
    branches:
      - '**'
      - '!main'
      - '!develop'
  pull_request:
    paths:
      - 'chess-web-ui/**'
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd chess-web-ui
          npm install
      - name: Build check
        run: |
          cd chess-web-ui
          npm run build
      - name: Run unit tests
        run: |
          cd chess-web-ui
          # npm run test # Enable when tests are ready
