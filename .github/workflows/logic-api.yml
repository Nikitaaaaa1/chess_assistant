name: Logic API CI

on:
  push:
    paths:
      - 'chess-logic-api/**'
    branches:
      - '**'
      - '!main'
      - '!develop'
  pull_request:
    paths:
      - 'chess-logic-api/**'
    branches:
      - develop
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd chess-logic-api
          pip install ruff pytest fastapi uvicorn pika python-chess httpx websockets
      - name: Lint with ruff
        run: |
          cd chess-logic-api
          ruff check .
      - name: Run Tests
        run: |
          cd chess-logic-api
          echo "Executing logic API tests..."
          # pytest # Add real tests when available
