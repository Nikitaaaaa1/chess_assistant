name: Vision Service CI

on:
  push:
    paths:
      - 'chess-vision-service/**'
    branches:
      - '**'
      - '!main'
      - '!develop'
  pull_request:
    paths:
      - 'chess-vision-service/**'
    branches:
      - develop
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd chess-vision-service
          pip install ruff pytest opencv-python-headless pika numpy ultralytics
      - name: Lint with ruff
        run: |
          cd chess-vision-service
          ruff check .
      - name: Run unit tests
        run: |
          cd chess-vision-service
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/
